<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛗 電梯遊戲</title>
  <meta name="description" content="互動電梯模擬遊戲 — 輸入樓層，觀看電梯動畫！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Decorative floating clouds -->
  <div class="clouds-container" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
  </div>

  <div class="game-container">

    <!-- ===== Left: Elevator Interior ===== -->
    <div class="elevator-section">
      <div class="elevator-frame">

        <!-- Floor Display Panel -->
        <div class="display-panel">
          <div class="arrow arrow-up" id="arrow-up">▲</div>
          <table class="floor-display-table" id="floor-display">
            <tr>
              <td class="digit" id="digit-1"></td>
              <td class="digit" id="digit-2"></td>
              <td class="digit" id="digit-3">1</td>
            </tr>
          </table>
          <div class="arrow arrow-down" id="arrow-down">▼</div>
        </div>

        <!-- Elevator Doors -->
        <div class="door-frame">
          <div class="door-container">
            <div class="elevator-interior">
              <div class="interior-lamp"></div>
              <div class="interior-mirror"></div>
              <div class="interior-rail"></div>
              <div class="interior-floor"></div>
            </div>
            <div class="door door-left" id="door-left"></div>
            <div class="door door-right" id="door-right"></div>
          </div>
        </div>

        <!-- Input Area -->
        <form id="floor-form" class="input-area" action="javascript:void(0);">
          <input
            type="text"
            id="floor-input"
            maxlength="4"
            autocomplete="off"
            inputmode="email"
            style="ime-mode: disabled;"
            placeholder="請輸入樓層"
          />
        </form>


      </div>
    </div>

    <!-- ===== Right: Building Cross-Section ===== -->
    <div class="building-section">
      <div class="building-wrapper">
        <div class="building-roof"></div>
        <div class="building-body">
          <div class="shaft-viewport" id="shaft-viewport">
            <div class="shaft-strip" id="shaft-strip">
              <!-- Floor slots generated by JS -->
            </div>
            <!-- Car indicator (fixed at center) -->
            <div class="car-indicator">
              <div class="car-box">
                <div class="car-window"></div>
                <div class="car-door-line"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="building-base"></div>
      </div>
    </div>

  </div>

  <!-- Status Panel -->
  <div class="status-panel" id="status-panel">
    語音播報: <span id="voice-status">讀取中...</span>
    <div style="font-size: 0.75rem; margin-top: 4px; color: rgba(255,255,255,0.6);">(修改 setting.ini 後重新整理生效)</div>
  </div>

  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
